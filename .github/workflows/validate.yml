name: Validate HammerDB Results

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate artifacts
        run: python tools/validate_result.py

      - name: Verify new result GitHub submitters
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUBMISSION_APP_BOT_LOGIN: ${{ vars.SUBMISSION_APP_BOT_LOGIN }}
        run: python tools/check_pr_submitter.py

      - name: Verify original submitter owns annotation changes
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/check_annotation_author.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Test comment form
        run: node --test tests/test_annotation_form.cjs

      - name: Test authorised and manual result submission workflows
        run: node --test tests/test_submit_form.cjs service/worker.test.mjs

      - name: Build leaderboard
        run: python tools/build_leaderboard.py

      - name: Check leaderboard.json is valid JSON
        run: python -m json.tool site/leaderboard.json > /dev/null
