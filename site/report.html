<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HammerDB Result Report</title>
  <style>
    body { margin:0; font-family:Inter,Arial,sans-serif; background:#f4f7ff; color:#111827; }
    .wrap { max-width:1100px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid #d7e0f1; border-radius:14px; padding:16px; margin-bottom:14px; }
    h1,h2,h3 { margin: 0 0 10px; }
    .muted { color:#596782; }
    .grid { display:grid; gap:10px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
    dl { display:grid; grid-template-columns: 220px 1fr; gap:6px 10px; margin:0; }
    dt { font-weight:700; }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #d7e0f1; padding:6px; text-align:left; }
    canvas { width:100%; height:260px; background:linear-gradient(#fff,#fafcff); border:1px solid #d7e0f1; border-radius:12px; }
    .error { background:#ffecec; border-left:5px solid #d9534f; }
  </style>
</head>
<body>
<main class="wrap">
  <div id="status" class="card muted">Loading report…</div>
  <div id="content" style="display:none;">
    <section class="card">
      <h1 id="title">HammerDB Result Report</h1>
      <p class="muted" id="subtitle"></p>
      <div class="grid" id="headline"></div>
    </section>
    <section class="card"><h2>Benchmark configuration</h2><dl id="config"></dl></section>
    <section class="card"><h2>System details</h2><dl id="system"></dl></section>
    <section class="card"><h2>Response-time percentiles</h2><table><thead><tr><th>Name</th><th>p25</th><th>p50</th><th>p75</th><th>p95</th><th>p99</th></tr></thead><tbody id="rt"></tbody></table></section>
    <section class="card"><h2>TPROC-C Result (NOPM/TPM)</h2><canvas id="bar"></canvas></section>
    <section class="card"><h2>Response time percentile profile</h2><canvas id="box"></canvas></section>
    <section class="card"><h2>Transaction count</h2><canvas id="tx"></canvas></section>
    <section class="card"><h2>CPU %</h2><canvas id="cpu"></canvas></section>
    <section class="card"><h2>IOPS</h2><canvas id="iops"></canvas></section>
    <section class="card"><h2>MB/s</h2><canvas id="mbps"></canvas></section>
    <section class="card"><h2>Disclaimer</h2><div id="disclaimer"></div></section>
  </div>
</main>
<script>
(function(){
const q=new URLSearchParams(location.search);const artifact=q.get('artifact');
const status=document.getElementById('status'); const content=document.getElementById('content');
function err(m){status.className='card error';status.textContent=m;}
if(!artifact){err('Missing artifact query parameter. Use report.html?artifact=results/...json');return;}
fetch(artifact).then(r=>{if(!r.ok)throw new Error('Fetch failed HTTP '+r.status);return r.text();}).then(t=>{let a;try{a=JSON.parse(t);}catch(e){throw new Error('Invalid JSON in artifact');}
const job=a.job||{}, cfg=a.benchmark_config||{}, sys=a.system||{}, res=a.result||{};
if(!job.jobid||!job.benchmark||!job.database_display||!job.timestamp){throw new Error('Missing required fields in job.*');}
status.style.display='none'; content.style.display='block';
document.getElementById('title').textContent=`${job.database_display} ${job.benchmark} report`;
document.getElementById('subtitle').textContent=`Job ${job.jobid} · ${job.timestamp}`;
const head=document.getElementById('headline');
[['Benchmark',job.benchmark],['Database',job.database_display],['Release',job.release],['HDB Version',job.hdb_version],['NOPM',res.nopm],['TPM',res.tpm],['Geomean (s)',res.geomean_seconds],['Total Query (s)',res.total_query_time_seconds]].forEach(([k,v])=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<strong>${k}</strong><div>${v??'—'}</div>`;head.appendChild(d);});
function fillDl(id,obj){const el=document.getElementById(id);Object.entries(obj).forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v??'—';el.appendChild(dt);el.appendChild(dd);});}
fillDl('config',cfg); fillDl('system',sys);
const rt=document.getElementById('rt'); (a.response_times&&a.response_times.rows||[]).forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r.name||''}</td><td>${r.p25_ms??''}</td><td>${r.p50_ms??''}</td><td>${r.p75_ms??''}</td><td>${r.p95_ms??''}</td><td>${r.p99_ms??''}</td>`;rt.appendChild(tr);});
document.getElementById('disclaimer').textContent=(a.disclaimer&&a.disclaimer.text)||'Community-submitted, unaudited, not official TPC benchmark results.';
function drawLine(id,pts,key,color){const c=document.getElementById(id),x=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio; x.clearRect(0,0,w,h); if(!pts||!pts.length)return; const vals=pts.map(p=>+p[key]||0),min=Math.min(...vals),max=Math.max(...vals),pad=30*devicePixelRatio; x.strokeStyle='#d7e0f1';x.strokeRect(pad,pad,w-2*pad,h-2*pad); x.beginPath();x.strokeStyle=color;vals.forEach((v,i)=>{const xx=pad+(i*(w-2*pad)/(Math.max(1,vals.length-1)));const yy=h-pad-((v-min)/(max-min||1))*(h-2*pad); i?x.lineTo(xx,yy):x.moveTo(xx,yy);});x.stroke();}
function drawBar(){const vals=[['NOPM',+res.nopm||0],['TPM',+res.tpm||0]];const c=document.getElementById('bar'),x=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio,p=30*devicePixelRatio,m=Math.max(...vals.map(v=>v[1]),1); x.clearRect(0,0,w,h); vals.forEach((v,i)=>{const bw=(w-3*p)/2,xx=p+i*(bw+p),bh=(v[1]/m)*(h-2*p); x.fillStyle=i?'#7aa2ff':'#4f78d1'; x.fillRect(xx,h-p-bh,bw,bh); x.fillStyle='#111'; x.fillText(v[0],xx,h-p+14);});}
function drawBox(){const rows=(a.response_times&&a.response_times.rows)||[];const c=document.getElementById('box'),x=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio,p=30*devicePixelRatio; x.clearRect(0,0,w,h); if(!rows.length)return; const max=Math.max(...rows.map(r=>+r.p99_ms||0),1); rows.forEach((r,i)=>{const cx=p+(i+0.5)*(w-2*p)/rows.length; const y=v=>h-p-((+v||0)/max)*(h-2*p); x.strokeStyle='#4f78d1'; x.beginPath(); x.moveTo(cx,y(r.p99_ms)); x.lineTo(cx,y(r.p25_ms)); x.stroke(); x.fillStyle='#7aa2ff'; const top=y(r.p75_ms),bot=y(r.p25_ms); x.fillRect(cx-12,top,24,bot-top); x.strokeStyle='#111'; x.beginPath(); x.moveTo(cx-12,y(r.p50_ms)); x.lineTo(cx+12,y(r.p50_ms)); x.stroke();});}
const txSeries=(((a.transaction_count||{}).series||[])[0]||{}).points||[];
const cpu=((a.metrics||{}).cpu_percent)||[];
const iops=((a.metrics||{}).iops)||[];
const mbps=((a.metrics||{}).mbps)||[];
window.addEventListener('resize',()=>{drawBar();drawBox();drawLine('tx',txSeries,'value','#4f78d1');drawLine('cpu',cpu,'usr_pct','#d14f4f');drawLine('iops',iops,'value','#4fa16c');drawLine('mbps',mbps,'value','#9466d6');});
drawBar();drawBox();drawLine('tx',txSeries,'value','#4f78d1');drawLine('cpu',cpu,'usr_pct','#d14f4f');drawLine('iops',iops,'value','#4fa16c');drawLine('mbps',mbps,'value','#9466d6');
}).catch(e=>err(e.message));
})();
</script>
</body></html>
