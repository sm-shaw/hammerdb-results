<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HammerDB Report</title>
<style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f8fc;color:#111827}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;z-index:2}.wrap{max-width:1100px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #e1e7f5;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.tile{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#eef2ff;border-radius:999px;padding:4px 10px}.kv{display:grid;grid-template-columns:220px 1fr;gap:6px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #e5e7eb;padding:6px}.chart{width:100%;height:260px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.error{background:#fff1f2;border-left:4px solid #e11d48}</style></head>
<body><div class="top"><a href="index.html">← Back to leaderboard</a></div><main class="wrap"><div id="status" class="card">Loading report…</div><div id="content" style="display:none">
<section class="card"><h1 id="h1"></h1><p id="sub"></p><div class="grid" id="metrics"></div></section>
<section class="card"><h2>Benchmark configuration</h2><div class="chips" id="cfg"></div></section>
<section class="card"><h2>System</h2><div class="kv" id="sys"></div></section>
<section class="card"><h2>Response Times</h2><table><thead><tr><th>Name</th><th>p25</th><th>p50</th><th>p75</th><th>p95</th><th>p99</th></tr></thead><tbody id="rt"></tbody></table></section>
<section class="card"><h2>NOPM/TPM</h2><canvas id="bar" class="chart"></canvas></section>
<section class="card"><h2>Response time percentile profile</h2><canvas id="box" class="chart"></canvas></section>
<section class="card"><h2>Transaction count</h2><canvas id="tx" class="chart"></canvas></section>
<section class="card"><h2>CPU</h2><canvas id="cpu" class="chart"></canvas></section>
<section class="card"><h2>IOPS</h2><canvas id="iops" class="chart"></canvas></section>
<section class="card"><h2>MB/s</h2><canvas id="mbps" class="chart"></canvas></section>
<section class="card"><h2>Disclaimer</h2><div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px">Community-submitted HammerDB results. Unaudited. Not official TPC benchmark results.</div></section>
</div></main>
<script>
(function(){const qp=new URLSearchParams(location.search);const raw=qp.get('artifact');const status=document.getElementById('status');const content=document.getElementById('content');function fail(msg,detail){status.className='card error';status.innerHTML='<strong>'+msg+'</strong><pre>'+detail+'</pre>';}if(!raw){fail('Missing artifact parameter','artifact='+raw);return;}const artifactParam=decodeURIComponent(raw);const resolved=artifactParam;
fetch(resolved).then(r=>{if(!r.ok){fail('Fetch failed',`artifact parameter: ${raw}\nresolved fetch path: ${resolved}\nHTTP status: ${r.status}`);throw new Error('stop');}return r.json();}).then(a=>{const j=a.job||{},r=a.result||{},cfg=a.benchmark_config||{},sys=a.system||{};if(!j.jobid){fail('Missing required fields','job.jobid missing');return;}status.style.display='none';content.style.display='block';document.getElementById('h1').textContent=`${j.database_display||j.database||'Unknown'} ${j.benchmark||''}`;document.getElementById('sub').textContent=`Job ${j.jobid} · ${j.timestamp||''}`;
const metricData=[['Release',j.release],['Benchmark',j.benchmark],['HammerDB',j.hdb_version],['Timestamp',j.timestamp],['Job ID',j.jobid],['NOPM',r.nopm],['TPM',r.tpm],['Geomean(s)',r.geomean_seconds],['Total Query(s)',r.total_query_time_seconds]];const m=document.getElementById('metrics');metricData.forEach(([k,v])=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<small>${k}</small><div><strong>${v??'—'}</strong></div>`;m.appendChild(d);});
Object.entries(cfg).forEach(([k,v])=>{const c=document.createElement('span');c.className='chip';c.textContent=`${k}: ${v}`;document.getElementById('cfg').appendChild(c);});
Object.entries(sys).forEach(([k,v])=>{const dt=document.createElement('div');dt.innerHTML=`<strong>${k}</strong>`;const dd=document.createElement('div');dd.textContent=v??'—';const s=document.getElementById('sys');s.appendChild(dt);s.appendChild(dd);});
(a.response_times?.rows||[]).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x.name||''}</td><td>${x.p25_ms??''}</td><td>${x.p50_ms??''}</td><td>${x.p75_ms??''}</td><td>${x.p95_ms??''}</td><td>${x.p99_ms??''}</td>`;document.getElementById('rt').appendChild(tr);});
function noData(ctx,msg,w,h){ctx.fillStyle='#6b7280';ctx.fillText(msg,20,30);}function line(id,pts,key,color){const c=document.getElementById(id),ctx=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#d1d5db';ctx.strokeRect(40,20,w-60,h-60);if(!pts.length){noData(ctx,'No data available',w,h);return;}const vals=pts.map(p=>+p[key]||0),mn=Math.min(...vals),mx=Math.max(...vals);ctx.strokeStyle=color;ctx.beginPath();vals.forEach((v,i)=>{const x=40+i*(w-60)/Math.max(1,vals.length-1),y=h-40-((v-mn)/(mx-mn||1))*(h-60);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.fillStyle='#4b5563';ctx.fillText('value',6,16);}function bar(){const c=document.getElementById('bar'),ctx=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio;ctx.clearRect(0,0,w,h);const vals=[['NOPM',+r.nopm||0],['TPM',+r.tpm||0]];const max=Math.max(...vals.map(v=>v[1]),1);vals.forEach((v,i)=>{const bw=120*devicePixelRatio,x=70*devicePixelRatio+i*200*devicePixelRatio,bh=(v[1]/max)*(h-80*devicePixelRatio);ctx.fillStyle=i?'#60a5fa':'#2563eb';ctx.fillRect(x,h-40*devicePixelRatio-bh,bw,bh);ctx.fillStyle='#111';ctx.fillText(v[0],x,h-18*devicePixelRatio);});if(!(+r.nopm||+r.tpm))noData(ctx,'No data available',w,h);}function box(){const rows=a.response_times?.rows||[];const c=document.getElementById('box'),ctx=c.getContext('2d');const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=260*devicePixelRatio;ctx.clearRect(0,0,w,h);if(!rows.length){noData(ctx,'No data available',w,h);return;}const max=Math.max(...rows.map(x=>+x.p99_ms||0),1);rows.forEach((row,i)=>{const cx=50+i*(w-100)/rows.length;const y=v=>h-40-((+v||0)/max)*(h-70);ctx.strokeStyle='#2563eb';ctx.beginPath();ctx.moveTo(cx,y(row.p99_ms));ctx.lineTo(cx,y(row.p25_ms));ctx.stroke();ctx.fillStyle='#93c5fd';ctx.fillRect(cx-10,y(row.p75_ms),20,y(row.p25_ms)-y(row.p75_ms));ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(cx-10,y(row.p50_ms));ctx.lineTo(cx+10,y(row.p50_ms));ctx.stroke();});}
const tx=((a.transaction_count?.series||[])[0]?.points)||[]; const cpu=a.metrics?.cpu_percent||[]; const iops=a.metrics?.iops||[]; const mbps=a.metrics?.mbps||[]; function drawAll(){bar();box();line('tx',tx,'value','#2563eb');line('cpu',cpu,'usr_pct','#dc2626');line('iops',iops,'value','#16a34a');line('mbps',mbps,'value','#7c3aed');}
window.addEventListener('resize',drawAll);drawAll();}).catch(e=>{if(e.message!=='stop')fail('Error loading report',`artifact parameter: ${raw}\nresolved fetch path: ${artifactParam}\n${e.message}`);});
})();</script></body></html>
