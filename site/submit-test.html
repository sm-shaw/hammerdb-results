<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HammerDB Result Submit Test</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7ff;color:#0f172a;margin:0;line-height:1.5}.wrap{max-width:900px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:18px;margin-bottom:14px}.btn{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.good{background:#15803d}.btn:disabled{opacity:.55;cursor:not-allowed}.status{border-radius:12px;background:#fff;border:1px solid #ddd8cf;padding:12px;margin-bottom:14px}.ok{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}.err{background:#fff1f2;color:#be123c;border-color:#fecdd3}.row{display:flex;gap:10px;flex-wrap:wrap}textarea{width:100%;height:320px;font-family:Consolas,monospace;font-size:13px}code{word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
<h1>HammerDB Result Submit Test</h1>
<div id="status" class="status">Choose a saved HammerDB JSON result artifact.</div>
<div class="card">
<input id="file" type="file" accept="application/json,.json">
<p><strong>Target:</strong> <code id="target">not loaded</code></p>
<div class="row">
<button id="copy" class="btn good" disabled>Copy JSON</button>
<button id="go" class="btn" disabled>Continue to GitHub</button>
</div>
</div>
<div class="card">
<h2>Raw JSON</h2>
<textarea id="raw" readonly></textarea>
</div>
</div>
<script>
(function(){
const OWNER="sm-shaw";
const REPO="hammerdb-results";
const BRANCH="master";
const fileEl=document.getElementById("file");
const statusEl=document.getElementById("status");
const targetEl=document.getElementById("target");
const rawEl=document.getElementById("raw");
const copyBtn=document.getElementById("copy");
const goBtn=document.getElementById("go");
let rawJson="";
let path="";
function status(msg,kind){statusEl.className="status"+(kind?" "+kind:"");statusEl.textContent=msg;}
function slug(v){return String(v||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function reset(){rawJson="";path="";rawEl.value="";targetEl.textContent="not loaded";copyBtn.disabled=true;goBtn.disabled=true;}
async function exists(p){const u="https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"+p;const r=await fetch(u,{cache:"no-store"});if(r.status===200)return true;if(r.status===404)return false;throw new Error("duplicate check failed");}
fileEl.addEventListener("change",async()=>{
reset();
const f=fileEl.files[0];
if(!f)return;
let obj;
try{obj=JSON.parse(await f.text());}catch(e){status("Invalid JSON file.","err");return;}
const job=obj.job||{};
const missing=["jobid","benchmark","database","database_display","timestamp","hdb_version"].filter(k=>!job[k]);
if(missing.length){status("Missing required fields: "+missing.join(", "),"err");return;}
const m=String(job.timestamp).replace("T"," ").match(/^(\d{4})-(\d{2})-(\d{2})(?:\s|$)/);
if(!m){status("Invalid timestamp: must start YYYY-MM-DD.","err");return;}
path="results/"+slug(job.benchmark)+"/"+slug(job.database_display||job.database)+"/"+m[1]+"/"+m[2]+"/"+job.jobid+".json";
rawJson=JSON.stringify(obj,null,2);
rawEl.value=rawJson;
targetEl.textContent=path;
status("Checking for duplicate...");
try{if(await exists(path)){status("Already submitted: "+path,"err");return;}}catch(e){status("Could not check duplicate; continuing disabled.","err");return;}
copyBtn.disabled=false;goBtn.disabled=false;
status("Ready. Click Copy JSON, then Continue to GitHub.","ok");
});
copyBtn.addEventListener("click",async()=>{
try{await navigator.clipboard.writeText(rawJson);status("JSON copied. Continue to GitHub and paste into the editor.","ok");}
catch(e){rawEl.focus();rawEl.select();status("Copy failed. Press Ctrl+C in the Raw JSON box, then continue.","err");}
});
goBtn.addEventListener("click",async()=>{
if(!path)return;
try{await navigator.clipboard.writeText(rawJson);}catch(e){}
window.open("https://github.com/"+OWNER+"/"+REPO+"/new/"+BRANCH+"?filename="+encodeURIComponent(path),"_blank","noopener");
});
})();
</script>
</body>
</html>
